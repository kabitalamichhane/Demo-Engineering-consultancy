{% if company.whatsapp_link or company.viber_link %}
<div class="chat-buttons" aria-label="Chat with us">
  {% if company.viber_link %}
  <a href="{{ company.viber_link }}" class="chat-btn chat-viber" aria-label="Chat on Viber" title="Chat on Viber">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><path d="M4 3h16a2 2 0 012 2v11a2 2 0 01-2 2H10l-5 4v-4H4a2 2 0 01-2-2V5a2 2 0 012-2z"/><path d="M7.5 7.5l4.5 8 4.5-8" fill="none" stroke="#7360f2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  {% endif %}
  {% if company.whatsapp_link %}
  <a href="{{ company.whatsapp_link }}?text=Hello%20Highnoon%20Engineering%20Solutions%2C%20I%20would%20like%20to%20ask%20about%20your%20services." target="_blank" rel="noopener noreferrer" class="chat-btn chat-whatsapp" aria-label="Chat on WhatsApp" title="Chat on WhatsApp">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true"><path d="M4 3h16a2 2 0 012 2v11a2 2 0 01-2 2H10l-5 4v-4H4a2 2 0 01-2-2V5a2 2 0 012-2z"/><circle cx="8" cy="10.5" r="1.3" fill="#25d366"/><circle cx="12" cy="10.5" r="1.3" fill="#25d366"/><circle cx="16" cy="10.5" r="1.3" fill="#25d366"/></svg>
  </a>
  {% endif %}
</div>
{% endif %}
